<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Contraseña - SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">✏️ Editar Registro</h3>
                    <form id="form-editar">
                        <div class="mb-3">
                            <label class="form-label">Plataforma</label>
                            <input type="text" id="edit-plataforma" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Usuario / Correo</label>
                            <input type="text" id="edit-usuario" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nueva Contraseña</label>
                            <input type="password" id="edit-clave" class="form-control" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="index.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Actualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API_URL = "http://127.0.0.1:5000";
        const urlParams = new URLSearchParams(window.location.search);
        const idRegistro = urlParams.get('id');

        async function cargarDatosIndividuales() {
            if (!idRegistro) return;
            try {
                const response = await fetch(`${API_URL}/consulta_individual/${idRegistro}`);
                const data = await response.json();
                if (data.baul) {
                    document.getElementById('edit-plataforma').value = data.baul.Plataforma;
                    document.getElementById('edit-usuario').value = data.baul.usuario;
                }
            } catch (error) { console.error("Error al cargar:", error); }
        }

        document.getElementById('form-editar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const plataforma = document.getElementById('edit-plataforma').value;
            const usuario = document.getElementById('edit-usuario').value;
            const clave = document.getElementById('edit-clave').value;

            try {
                const response = await fetch(`${API_URL}/actualizar/${idRegistro}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plataforma, usuario, clave })
                });
                const result = await response.json();
                alert(result.mensaje);
                window.location.href = 'index.html';
            } catch (error) { console.error("Error al actualizar:", error); }
        });

        cargarDatosIndividuales();
    </script>
</body>

</html>
