<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contraseñas - SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">🔐 Baúl de Contraseñas - ADSO</h2>
        <div class="card shadow p-4 mb-4">
            <h4>Agregar Nueva Contraseña</h4>
            <form id="form-contrasena">
                <div class="mb-3">
                    <label class="form-label">Plataforma</label>
                    <input type="text" id="plataforma" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario / Correo</label>
                    <input type="text" id="usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="clave" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Contraseña</button>
            </form>
        </div>
        <div class="card shadow p-4">
            <h4>Registros Guardados</h4>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Plataforma</th>
                        <th>Usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-datos"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
